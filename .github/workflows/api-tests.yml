name: API tests

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/app_tests/requirements.txt

      - name: Install Python test dependencies
        run: pip install -r app_tests/requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Start server
        run: npm run start:test &

      - name: Run tests
        run: |
          pytest -n auto --dist load --junitxml=pytest-report.xml \
            --tracing=retain-on-failure --screenshot=only-on-failure --video=retain-on-failure

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: app/pytest-report.xml

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: app/test-results/
          if-no-files-found: ignore
